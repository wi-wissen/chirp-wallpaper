name: Release

# Run manually: Actions → Release → "Run workflow", enter a version like 0.1.0.
# Builds the current main branch, tags it vX.Y.Z and publishes a release.
# Asset names never contain the version, so the website can always link to
# https://github.com/wi-wissen/chirp-wallpaper/releases/latest/download/<asset>.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number, e.g. 0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$VERSION' is not a version like 1.2.3"; exit 1
          fi
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "::error::Tag v$VERSION already exists"; exit 1
          fi
      - id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: ChirpWallpaper.exe
            package: chirp-app
            binary: ChirpWallpaper.exe
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: chirp-windows-x64.exe
            package: chirp
            binary: chirp.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: chirp-wallpaper-linux-x86_64.tar.gz
            package: chirp
            binary: chirp
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Set version
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: sed -i.bak "0,/^version = \".*\"/s//version = \"$VERSION\"/" Cargo.toml && rm Cargo.toml.bak
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libadwaita-1-dev
      - run: cargo build --release --target ${{ matrix.target }} -p ${{ matrix.package }}
      - if: runner.os == 'Linux'
        run: cargo build --release --target ${{ matrix.target }} -p chirp-gnome
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: cp target/${{ matrix.target }}/release/${{ matrix.binary }} ${{ matrix.asset }}
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir chirp-wallpaper
          cp target/${{ matrix.target }}/release/chirp target/${{ matrix.target }}/release/chirp-wallpaper \
             crates/chirp-gnome/data/* README.md LICENSE chirp-wallpaper/
          tar czf ${{ matrix.asset }} chirp-wallpaper
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: [check, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          SHA: ${{ needs.check.outputs.sha }}
        run: |
          gh release create "v$VERSION" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SHA" \
            --title "Chirp Wallpaper $VERSION" \
            --generate-notes
