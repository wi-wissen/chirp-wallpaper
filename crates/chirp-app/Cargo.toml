[package]
name = "chirp-app"
description = "Chirp Wallpaper app: the daily Bing picture as desktop background and lock screen, with a window and a tray icon."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "ChirpWallpaper"
path = "src/main.rs"

[dependencies]
chirp-core = { path = "../chirp-core" }
chirp-native = { path = "../chirp-native" }
slint = { version = "1.19", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "accessibility"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
open = "5"
time = { version = "0.3", features = ["parsing", "formatting", "macros"] }
sys-locale = "0.3"

[target.'cfg(windows)'.dependencies]
tray-icon = "0.21"
runas = "1"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
slint-build = "1.19"
winresource = "0.1"
