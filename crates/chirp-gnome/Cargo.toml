[package]
name = "chirp-gnome"
description = "Chirp Wallpaper for GNOME: the daily Bing picture as desktop background, a native GTK 4 / libadwaita app."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "chirp-wallpaper"
path = "src/main.rs"

[target.'cfg(target_os = "linux")'.dependencies]
chirp-core = { path = "../chirp-core" }
chirp-native = { path = "../chirp-native" }
gtk = { package = "gtk4", version = "0.11", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
time = { version = "0.3", features = ["parsing", "formatting", "macros"] }
sys-locale = "0.3"
