[package]
name = "chirp"
description = "Chirp Wallpaper: the daily Bing picture as desktop background and lock screen."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "chirp"
path = "src/main.rs"

[dependencies]
chirp-core = { path = "../chirp-core" }
clap = { version = "4", features = ["derive"] }
fluent-bundle = "0.15"
unic-langid = "0.9"
sys-locale = "0.3"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows = { version = "0.58", features = [
    "Foundation",
    "Storage",
    "Storage_Streams",
    "System_UserProfile",
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_System_Com",
] }

[dev-dependencies]
fluent-syntax = "0.11"
