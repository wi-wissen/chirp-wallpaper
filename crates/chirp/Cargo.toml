[package]
name = "chirp"
description = "Chirp Wallpaper command line program: the daily Bing picture as desktop background and lock screen."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "chirp"
path = "src/main.rs"

[dependencies]
chirp-core = { path = "../chirp-core" }
chirp-native = { path = "../chirp-native" }
clap = { version = "4", features = ["derive"] }
sys-locale = "0.3"
